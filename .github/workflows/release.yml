name: Release
on:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: release notes from changelog
        id: notes
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p=($2==v); next} p' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          if ! grep -q . notes.md; then
            echo "no CHANGELOG.md section for $ver" >&2; exit 1
          fi
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::GPG_SIGNING_KEY secret not set — every release must be signed" >&2; exit 1
          fi
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          sed "s/{TAG}/$GITHUB_REF_NAME/" .github/release-verify.md > verify.txt
          gpg --batch --yes --clearsign --output verify.txt.asc verify.txt
          { echo; echo '## Verify this release'; echo; echo '```text'; cat verify.txt.asc; echo '```'; } >> notes.md
          { echo 'body<<NOTES_EOF'; cat notes.md; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Saavi ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
      - name: Sign artifacts
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::GPG_SIGNING_KEY secret not set — refusing to publish an unsigned release" >&2
            gh release delete "$GITHUB_REF_NAME" --yes || true
            exit 1
          fi
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          shopt -s nullglob
          mkdir -p out
          for f in src-tauri/target/release/bundle/deb/*.deb \
                   src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" out/
            gpg --batch --yes --detach-sign --output "out/$(basename "$f").sig" "$f"
          done
          gpg --batch --export --armor > out/saavi_pubkey.gpg
          cd out
          sha256sum *.deb *.AppImage > SHA256SUMS
          gpg --batch --yes --clearsign --output SHA256SUMS.asc SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./*.sig saavi_pubkey.gpg SHA256SUMS SHA256SUMS.asc
      - name: Download manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A machine-readable index of this release for download pages
          # (kaditham.ie/saavi and siblings) — see docs/DISTRIBUTION.md.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          ver="${GITHUB_REF_NAME#v}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          shopt -s nullglob
          cd out
          {
            printf '{\n  "name": "Saavi",\n  "version": "%s",\n  "tag": "%s",\n  "published": "%s",\n' "$ver" "$GITHUB_REF_NAME" "$date"
            printf '  "release_url": "https://github.com/%s/releases/tag/%s",\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf '  "signing_key": { "url": "%s/saavi_pubkey.gpg", "fingerprint": "DCF5 773B 84E9 AABA 785F D5A8 4D2A ECE6 8A95 3F46" },\n' "$base"
            printf '  "checksums": { "url": "%s/SHA256SUMS", "signed": "%s/SHA256SUMS.asc" },\n' "$base" "$base"
            printf '  "assets": [\n'
            first=1
            while read -r sum name; do
              case "$name" in
                *.deb)      platform=linux; format=deb ;;
                *.AppImage) platform=linux; format=appimage ;;
                *.dmg)      platform=macos; format=dmg ;;
                *.msi)      platform=windows; format=msi ;;
                *)          platform=unknown; format="${name##*.}" ;;
              esac
              arch=x86_64; case "$name" in *aarch64*|*arm64*) arch=aarch64 ;; esac
              [ $first = 1 ] || printf ',\n'; first=0
              printf '    { "name": "%s", "platform": "%s", "arch": "%s", "format": "%s", "url": "%s/%s", "sig": "%s/%s.sig", "sha256": "%s" }' \
                "$name" "$platform" "$arch" "$format" "$base" "$name" "$base" "$name" "$sum"
            done < SHA256SUMS
            printf '\n  ]\n}\n'
          } > latest.json
          python3 -m json.tool latest.json > /dev/null
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
