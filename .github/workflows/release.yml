name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
      - id: notes
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p=($2==v); next} p' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          if ! grep -q . notes.md; then
            echo "::error::no CHANGELOG.md section for $ver" >&2; exit 1
          fi
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::GPG_SIGNING_KEY secret not set — every release must be signed" >&2; exit 1
          fi
          { echo; cat .github/release-install.md; } >> notes.md
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          sed "s/{TAG}/$GITHUB_REF_NAME/" .github/release-verify.md > verify.txt
          gpg --batch --yes --clearsign --output verify.txt.asc verify.txt
          { echo; echo '## Verify this release'; echo; echo '```text'; cat verify.txt.asc; echo '```'; } >> notes.md
          { echo 'body<<NOTES_EOF'; cat notes.md; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: webview deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In-app updater: packages are minisign-signed with this key; the
          # matching public key is baked into the binary (tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Saavi ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Sign every asset, write SHA256SUMS + latest.json, publish
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          mkdir out && cd out
          gh release download "$GITHUB_REF_NAME" --dir .
          # tauri-action's updater manifest is ALSO named latest.json; it
          # becomes updater.json (what the in-app updater fetches, via the
          # site mirror) so ours keeps the name the download page reads.
          if [ -f latest.json ]; then mv latest.json updater.json; fi
          shopt -s nullglob
          assets=( *.deb *.AppImage *.dmg *.msi *.exe *.rpm )
          [ ${#assets[@]} -gt 0 ] || { echo "::error::no installers on the release" >&2; exit 1; }
          for f in "${assets[@]}"; do
            gpg --batch --yes --detach-sign --output "$f.sig" "$f"
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          gpg --batch --yes --clearsign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --export --armor > saavi_pubkey.gpg

          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          ver="${GITHUB_REF_NAME#v}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf '{\n  "name": "Saavi",\n  "version": "%s",\n  "tag": "%s",\n  "published": "%s",\n' "$ver" "$GITHUB_REF_NAME" "$date"
            printf '  "release_url": "https://github.com/%s/releases/tag/%s",\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf '  "signing_key": { "url": "%s/saavi_pubkey.gpg", "fingerprint": "DCF5 773B 84E9 AABA 785F D5A8 4D2A ECE6 8A95 3F46" },\n' "$base"
            printf '  "checksums": { "url": "%s/SHA256SUMS", "signed": "%s/SHA256SUMS.asc" },\n' "$base" "$base"
            printf '  "assets": [\n'
            first=1
            while read -r sum name; do
              case "$name" in
                *.deb)      platform=linux;   format=deb ;;
                *.rpm)      platform=linux;   format=rpm ;;
                *.AppImage) platform=linux;   format=appimage ;;
                *.dmg)      platform=macos;   format=dmg ;;
                *.msi)      platform=windows; format=msi ;;
                *.exe)      platform=windows; format=nsis ;;
                *)          platform=unknown; format="${name##*.}" ;;
              esac
              arch=x86_64
              case "$name" in *universal*) arch=universal ;; *aarch64*|*arm64*) arch=aarch64 ;; esac
              [ $first = 1 ] || printf ',\n'; first=0
              printf '    { "name": "%s", "platform": "%s", "arch": "%s", "format": "%s", "url": "%s/%s", "sig": "%s/%s.sig", "sha256": "%s" }' \
                "$name" "$platform" "$arch" "$format" "$base" "$name" "$base" "$name" "$sum"
            done < SHA256SUMS
            printf '\n  ]\n}\n'
          } > latest.json
          python3 -m json.tool latest.json > /dev/null
          gh release upload "$GITHUB_REF_NAME" ./*.sig saavi_pubkey.gpg SHA256SUMS SHA256SUMS.asc latest.json --clobber
          if [ -f updater.json ]; then gh release upload "$GITHUB_REF_NAME" updater.json --clobber; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
