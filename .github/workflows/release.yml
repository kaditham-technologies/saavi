name: Release
on:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: release notes from changelog
        id: notes
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p=($2==v); next} p' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          if ! grep -q . notes.md; then
            echo "no CHANGELOG.md section for $ver" >&2; exit 1
          fi
          if [ -n "$GPG_SIGNING_KEY" ]; then
            printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
            sed "s/{TAG}/$GITHUB_REF_NAME/" .github/release-verify.md > verify.txt
            gpg --batch --yes --clearsign --output verify.txt.asc verify.txt
            { echo; echo '## Verify this release'; echo; echo '```text'; cat verify.txt.asc; echo '```'; } >> notes.md
          fi
          { echo 'body<<NOTES_EOF'; cat notes.md; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Saavi ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
      - name: Sign artifacts
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "GPG_SIGNING_KEY secret not set; skipping signing"
            exit 0
          fi
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/deb/*.deb \
                   src-tauri/target/release/bundle/appimage/*.AppImage; do
            gpg --batch --yes --detach-sign --output "$(basename "$f").sig" "$f"
          done
          gpg --batch --export --armor > saavi_pubkey.gpg
          gh release upload "$GITHUB_REF_NAME" ./*.sig saavi_pubkey.gpg
